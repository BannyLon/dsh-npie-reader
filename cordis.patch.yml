# dsh-npie-reader bundle patch: inserts the reader plugin row into the profile
# roster. One `insert` row mounts both halves:
#   - host 半区 (lib/index.js): `rss` 服务、8 个 agent 工具、订阅抓取与本地存储
#   - client 半区 (lib/client.js): 侧边栏入口 + 阅读面板 + 原生对话伴读
# 生效方式：`dsh plugin --profile <name> add link:<this-dir>`，之后重启该 profile。
- insert:
    - id: npie-reader
      name: 'dsh-npie-reader'
